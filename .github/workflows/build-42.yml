name: Build 42 Android (mobile setup)

on:
  workflow_dispatch:
  push:
    branches: [build/42-mobile]
    paths: [.github/workflows/build-42.yml]

permissions:
  contents: read

concurrency:
  group: swiryyyyX-apk-${{ github.ref }}
  cancel-in-progress: false

