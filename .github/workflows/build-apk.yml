name: Build swiryyyyX APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swiryyyyX-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check required repository secrets
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PYCODE'
          import os
          keys = ('TELEGRAM_API_ID', 'TELEGRAM_API_HASH', 'GOOGLE_SERVICES_JSON')
          missing = [key for key in keys if not os.environ.get(key)]
          if missing:
              raise SystemExit('Missing repository Actions secrets: ' + ', '.join(missing))
          PYCODE
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Free space on disposable GitHub runner
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /opt/az
          sudo apt-get clean
          df -h /
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs ninja-build cmake build-essential perl yasm nasm pkg-config autoconf automake libtool
          git lfs install
      - name: Fetch pinned upstream and apply client changes
        run: |
          git init source
          git -C source remote add origin https://github.com/TGX-Android/Telegram-X.git
          git -C source fetch --depth=1 origin "$(cat UPSTREAM_COMMIT)"
          git -C source checkout --detach FETCH_HEAD
          git -C source apply --check "$GITHUB_WORKSPACE/swiryyyyX.patch"
          git -C source apply --index "$GITHUB_WORKSPACE/swiryyyyX.patch"
          git -C source submodule update --init --recursive --depth=1 --jobs 4
          git -C source/tdlib lfs pull
          test "$(git -C source/tdlib rev-parse HEAD)" = "1094df0caf4e5b59f6b247f8d9eb8896022cb379"
          test "$(head -n 1 source/tdlib/version.txt)" = "c15d3f5a5de6e3ba5839822c451152e5e18bb700"
          echo "TDLib bundle 1094df0; source c15d3f5; NDK 30.0.16248370"
      - name: Verify chat and gift regressions
        working-directory: source
        run: |
          python3 tests/sviri/run_checks.py
          python3 tests/sviri/check_activity_inbox.py tdlib/src/main/java/org/drinkless/tdlib/TdApi.java
          python3 tests/sviri/check_startup_presentation.py
          python3 tests/sviri/check_periodic_forward.py tdlib/src/main/java/org/drinkless/tdlib/TdApi.java
          python3 tests/sviri/check_tab_width.py
          python3 tests/sviri/check_gift_manage.py tdlib/src/main/java/org/drinkless/tdlib/TdApi.java
          python3 tests/sviri/check_gift_resale.py tdlib/src/main/java/org/drinkless/tdlib/TdApi.java
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: 15859902
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android components
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import subprocess
          props = dict(line.split('=', 1) for line in Path('source/version.properties').read_text().splitlines() if '=' in line and not line.lstrip().startswith('#'))
          packages = ['platforms;' + props['version.sdk_package'], 'build-tools;' + props['version.build_tools'], 'ndk;' + props['version.ndk_primary'], 'ndk;' + props['version.ndk_legacy'], 'cmake;' + props['version.cmake']]
          print('Installing pinned SDK packages:', ', '.join(packages), flush=True)
          subprocess.run(['sdkmanager', *packages], check=True)
          PYCODE
      - name: Configure personal client
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: python3 configure.py
      - name: Build ARM64 APK
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew assembleLatestArm64Debug --console=plain --no-daemon --no-parallel --no-configuration-cache -Dorg.gradle.isolated-projects=false -Dorg.gradle.unsafe.isolated-projects=false --max-workers=2 --info --stacktrace -Dorg.gradle.internal.http.connectionTimeout=30000 -Dorg.gradle.internal.http.socketTimeout=60000 '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' '-Dkotlin.daemon.jvm.options=-Xmx2g' &
          build_pid=$!
          (
            ticks=0
            while kill -0 "$build_pid" 2>/dev/null; do
              sleep 60
              ticks=$((ticks + 1))
              echo "::group::Runner health after $ticks minutes"
              ps -eo pid,comm,pcpu,pmem --sort=-pcpu | head -12 || true
              df -h /
              if [ $((ticks % 5)) -eq 0 ]; then
                daemon_pid=$(jps -l | awk '$2 ~ /GradleDaemon/ {print $1; exit}')
                if [ -n "$daemon_pid" ]; then
                  timeout 20 jcmd "$daemon_pid" Thread.print || true
                fi
              fi
              echo "::endgroup::"
            done
          ) &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
          set +e
          wait "$build_pid"
          build_exit=$?
          kill "$monitor_pid" 2>/dev/null || true
          exit "$build_exit"
      - name: Verify separate Test APK identity
        run: |
          python3 - <<'PYCODE'
          import os, re, subprocess
          from pathlib import Path
          props = dict(line.split('=', 1) for line in Path('source/version.properties').read_text().splitlines() if '=' in line and not line.lstrip().startswith('#'))
          aapt = Path(os.environ['ANDROID_HOME']) / 'build-tools' / props['version.build_tools'] / 'aapt'
          apks = list(Path('source/app/build/outputs/apk').rglob('*.apk'))
          if not apks:
              raise SystemExit('No Test APK produced')
          for apk in apks:
              info = subprocess.check_output([str(aapt), 'dump', 'badging', str(apk)], text=True)
              if not re.search(r"^package: name='ua\.swiryyyyx\.client\.test'", info, re.M):
                  raise SystemExit('Refusing artifact: package is not the separate Test package')
              if "application-label:'swiryyyyX Test'" not in info:
                  raise SystemExit('Refusing artifact: Test application label missing')
              print('Verified separate package ua.swiryyyyx.client.test; label swiryyyyX Test; file', apk.name)
          PYCODE
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: swiryyyyX-tdlib-test-arm64-debug
          path: source/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload diagnostic build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            source/build/reports/problems/
            source/app/.cxx/**/build_output.txt
            source/app/build/intermediates/cxx/**/build_output.txt
          if-no-files-found: ignore
          retention-days: 3
