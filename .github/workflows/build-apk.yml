name: Build swiryyyyX APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swiryyyyX-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check required repository secrets
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PYCODE'
          import os
          keys = ('TELEGRAM_API_ID', 'TELEGRAM_API_HASH', 'GOOGLE_SERVICES_JSON')
          missing = [key for key in keys if not os.environ.get(key)]
          if missing:
              raise SystemExit('Missing repository Actions secrets: ' + ', '.join(missing))
          PYCODE
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs ninja-build cmake build-essential perl yasm nasm pkg-config autoconf automake libtool
          git lfs install
      - name: Fetch pinned upstream and apply client changes
        run: |
          git init source
          git -C source remote add origin https://github.com/TGX-Android/Telegram-X.git
          git -C source fetch --depth=1 origin "$(cat UPSTREAM_COMMIT)"
          git -C source checkout --detach FETCH_HEAD
          git -C source apply --check "$GITHUB_WORKSPACE/swiryyyyX.patch"
          git -C source apply "$GITHUB_WORKSPACE/swiryyyyX.patch"
          git -C source submodule update --init --recursive --depth=1 --jobs 4
          git -C source/tdlib lfs pull
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android components
        run: sdkmanager 'platforms;android-37' 'build-tools;37.0.0' 'ndk;27.3.13750724' 'ndk;23.2.8568313'
      - name: Configure personal client
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: python3 configure.py
      - name: Build ARM64 APK
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew assembleLatestArm64Debug --console=plain --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' '-Dkotlin.daemon.jvm.options=-Xmx2g'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: swiryyyyX-arm64-debug
          path: source/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload diagnostic build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            source/build/reports/problems/
            source/app/.cxx/**/build_output.txt
            source/app/build/intermediates/cxx/**/build_output.txt
          if-no-files-found: ignore
          retention-days: 3
